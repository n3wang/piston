version: '3.2'

services:
    api:
        image: ghcr.io/engineer-man/piston
        container_name: piston_api
        restart: always
        privileged: true
        ports:
            - 2000:2000
        volumes:
            - ./data/piston/packages:/piston/packages
            - ./api/src:/piston_api/src
        environment:
            # Interactive cin + matplotlib import both need more than the 3s default.
            - PISTON_RUN_TIMEOUT=20000
            - PISTON_RUN_CPU_TIME=15000
            - PISTON_OUTPUT_MAX_SIZE=250000
            - PISTON_MAX_FILE_SIZE=15000000
        tmpfs:
            - /tmp:exec
