version: '3.2'

services:
    api:
        image: ghcr.io/engineer-man/piston
        container_name: piston_api
        restart: always
        privileged: true
        ports:
            - 2000:2000
        volumes:
            - ./data/piston/packages:/piston/packages
            - ./api/src:/piston_api/src
        environment:
            # Give students time to type at cin (interactive WebSocket).
            - PISTON_RUN_TIMEOUT=30000
        tmpfs:
            - /tmp:exec
